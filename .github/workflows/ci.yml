name: CI
on:
  push:
    branches: [main]
  pull_request:

# Tests and builds need no write access, and the checkout keeps no token, so
# nothing they run can push.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run astro check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke # Playwright e2e against the built site (preview server)
