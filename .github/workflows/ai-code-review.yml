name: AI code review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  review:
    if: >-
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    # The shared reusable workflow, pinned to the v1.5.0 release commit; the
    # reviewer job runs the action from the same commit, so the pin covers both.
    # Defaults: Sol as the finder, each finding checked by a verifier call before
    # it is posted, confirmed findings inline, incremental rounds after the first.
    uses: shariqh/ai-code-review/.github/workflows/review.yml@f62d6186659b1bb1fbf6f0712e24b95147a35968 # v1.5.0
    secrets:
      COPILOT_REVIEW_PAT: ${{ secrets.COPILOT_REVIEW_PAT }}
