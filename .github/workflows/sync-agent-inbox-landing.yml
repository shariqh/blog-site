name: Sync Agent Inbox landing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-agent-inbox-landing.yml"
      - "scripts/vendor-agent-inbox-landing.ts"
      - "package.json"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: sync-agent-inbox-landing
  cancel-in-progress: false

jobs:
  # Resolves, downloads and verifies the landing, including against npm, then
  # tests and builds it, all with a read-only token. AGENT_GH_TOKEN never
  # reaches this job, so nothing that runs here (the sync script, npm install
  # scripts, tests, the site build) can push or open pull requests.
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: read
    outputs:
      action: ${{ steps.delivery.outputs.action }}
      assets: ${{ steps.sync.outputs.assets }}
      base: ${{ steps.sync.outputs.base }}
      branch: ${{ steps.delivery.outputs.branch }}
      commit: ${{ steps.sync.outputs.commit }}
      npm: ${{ steps.sync.outputs.npm }}
      pr-number: ${{ steps.delivery.outputs.pr-number }}
      sha256: ${{ steps.sync.outputs.sha256 }}
      verified-head: ${{ steps.recovery.outputs.verified-head || steps.delivery.outputs.verified-head }}
    steps:
      - name: Check out blog site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Sync the latest landing revision
        id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || {
            echo "Sync checkout must match origin/main" >&2
            exit 1
          }
          result="$(npm run --silent sync:agent-inbox-landing -- --json)"
          changed="$(jq -r '.changed' <<<"$result")"
          commit="$(jq -r '.commit' <<<"$result")"
          sha256="$(jq -r '.sha256' <<<"$result")"
          assets="$(jq -c '.assets' <<<"$result")"
          npm="$(jq -c '.npm' <<<"$result")"
          [[ "$changed" == "true" || "$changed" == "false" ]] || {
            echo "Invalid changed result" >&2
            exit 1
          }
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]] || {
            echo "Invalid source commit" >&2
            exit 1
          }
          [[ "$sha256" =~ ^[a-f0-9]{64}$ ]] || {
            echo "Invalid source SHA-256" >&2
            exit 1
          }
          # Vendored files sit next to the landing page, under vendor/: scripts,
          # stylesheets and licenses, never anything a test runner collects.
          jq -e '
            type == "array" and length <= 16 and
            all(.[];
              type == "object" and keys == ["path", "sha256"] and
              (.path | type == "string" and
                test("^vendor(/[A-Za-z0-9][A-Za-z0-9._-]*){0,3}/(LICENSE|[A-Za-z0-9][A-Za-z0-9._-]*\\.(js|mjs|css))$") and
                (test("\\.(test|spec|bench(mark)?)(-d)?\\."; "i") | not)) and
              (.sha256 | type == "string" and test("^[a-f0-9]{64}$"))) and
            ([.[].path] | unique | length) == length
          ' <<<"$assets" >/dev/null || {
            echo "Invalid source assets" >&2
            exit 1
          }
          # Vendored files were checked against these npm releases.
          jq -e --argjson assets "$assets" '
            type == "array" and
            all(.[];
              type == "object" and keys == ["integrity", "package"] and
              (.package | type == "string" and
                test("^three@[0-9]+\\.[0-9]+\\.[0-9]+$")) and
              (.integrity | type == "string" and
                test("^sha512-[A-Za-z0-9+/]{86}==$"))) and
            ((length > 0) == ($assets | length > 0))
          ' <<<"$npm" >/dev/null || {
            echo "Invalid npm sources" >&2
            exit 1
          }
          echo "$result"
          {
            echo "changed=$changed"
            echo "commit=$commit"
            echo "sha256=$sha256"
            echo "assets=$assets"
            echo "base=$(git rev-parse HEAD)"
            echo "npm=$npm"
          } >>"$GITHUB_OUTPUT"

      - name: Inspect existing delivery state
        id: delivery
        if: steps.sync.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_ASSETS: ${{ steps.sync.outputs.assets }}
          SOURCE_COMMIT: ${{ steps.sync.outputs.commit }}
          SOURCE_SHA256: ${{ steps.sync.outputs.sha256 }}
        run: |
          set -euo pipefail
          asset_path_pattern='^public/agent-inbox/vendor(/[A-Za-z0-9][A-Za-z0-9._-]*){0,3}/(LICENSE|[A-Za-z0-9][A-Za-z0-9._-]*\.(js|mjs|css))$'
          test_name_pattern='\.([Tt][Ee][Ss][Tt]|[Ss][Pp][Ee][Cc]|[Bb][Ee][Nn][Cc][Hh]([Mm][Aa][Rr][Kk])?)(-[Dd])?\.'
          commit="$SOURCE_COMMIT"
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]] || exit 1
          branch="automation/agent-inbox-landing-$commit"
          verified_head=""
          verify_delivery_ref() {
            local ref="$1"
            local expected_commit="$2"
            local expected_hash="${3:-}"
            local expected_assets="${4:-[]}"
            [[ "$ref" =~ ^[a-f0-9]{40}$ ]] || {
              echo "Invalid delivery ref" >&2
              exit 1
            }
            local actual_metadata expected_metadata landing_hash metadata_commit metadata_hash
            local actual_hash asset actual_landing expected_landing
            local -a landing_files asset_entries
            landing_hash="$(
              gh api \
                --method GET \
                -H "Accept: application/vnd.github.raw+json" \
                "repos/$GITHUB_REPOSITORY/contents/public/agent-inbox/index.html" \
                -f "ref=$ref" |
                sha256sum |
                awk '{print $1}'
            )"
            actual_metadata="$RUNNER_TEMP/agent-inbox-metadata-$ref.json"
            expected_metadata="$RUNNER_TEMP/agent-inbox-expected-$ref.json"
            gh api \
              --method GET \
              -H "Accept: application/vnd.github.raw+json" \
              "repos/$GITHUB_REPOSITORY/contents/vendor/agent-inbox-landing.json" \
              -f "ref=$ref" >"$actual_metadata"
            metadata_commit="$(jq -r '.commit' "$actual_metadata")"
            metadata_hash="$(jq -r '.sha256' "$actual_metadata")"
            [[ "$metadata_hash" =~ ^[a-f0-9]{64}$ ]] || {
              echo "Existing delivery ref has invalid SHA-256 metadata" >&2
              exit 1
            }
            if [[ -z "$expected_hash" ]]; then
              expected_hash="$metadata_hash"
            fi
            jq -n \
              --arg repository "https://github.com/shariqh/agent-inbox" \
              --arg sourcePath "marketing/index.html" \
              --arg sourceRef "main" \
              --arg commit "$expected_commit" \
              --arg sha256 "$expected_hash" \
              --arg license "MIT" \
              --argjson assets "$expected_assets" \
              '{
                repository: $repository,
                sourcePath: $sourcePath,
                sourceRef: $sourceRef,
                commit: $commit,
                sha256: $sha256,
                license: $license
              } + if ($assets | length) > 0 then {assets: $assets} else {} end' \
              >"$expected_metadata"
            cmp --silent "$actual_metadata" "$expected_metadata" || {
              echo "Existing delivery ref has noncanonical metadata" >&2
              exit 1
            }
            tree="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/git/trees/$ref?recursive=1"
            )"
            [[ "$(jq -r '.truncated' <<<"$tree")" == "false" ]] || {
              echo "Delivery ref tree listing is truncated" >&2
              exit 1
            }
            # The landing directory holds index.html and exactly the vendored files.
            mapfile -t landing_files < <(
              jq -r '"index.html", .[].path | "public/agent-inbox/" + .' \
                <<<"$expected_assets" | LC_ALL=C sort
            )
            expected_landing="$(printf '%s\n' "${landing_files[@]}")"
            actual_landing="$(
              jq -r '.tree[] | select(
                .type != "tree" and (.path | startswith("public/agent-inbox/"))
              ) | .path' <<<"$tree" | LC_ALL=C sort
            )"
            [[ "$actual_landing" == "$expected_landing" ]] || {
              echo "Delivery ref has unexpected landing files" >&2
              exit 1
            }
            for path in \
              "${landing_files[@]}" \
              "vendor/agent-inbox-landing.json"; do
              entry="$(
                jq \
                  --arg path "$path" \
                  '[.tree[] | select(.path == $path)]' <<<"$tree"
              )"
              [[ "$(jq 'length' <<<"$entry")" == "1" &&
                 "$(jq -r '.[0].type' <<<"$entry")" == "blob" &&
                 "$(jq -r '.[0].mode' <<<"$entry")" == "100644" ]] || {
                echo "Delivery ref contains an invalid file mode for $path" >&2
                exit 1
              }
            done
            mapfile -t asset_entries < <(
              jq -r '.[] | .path + " " + .sha256' <<<"$expected_assets"
            )
            for asset in "${asset_entries[@]}"; do
              actual_hash="$(
                gh api \
                  --method GET \
                  -H "Accept: application/vnd.github.raw+json" \
                  "repos/$GITHUB_REPOSITORY/contents/public/agent-inbox/${asset% *}" \
                  -f "ref=$ref" |
                  sha256sum |
                  awk '{print $1}'
              )"
              [[ "$actual_hash" == "${asset#* }" ]] || {
                echo "Delivery ref does not match the resolved source for ${asset% *}" >&2
                exit 1
              }
            done
            [[ "$landing_hash" == "$expected_hash" &&
               "$metadata_commit" == "$expected_commit" &&
               "$metadata_hash" == "$expected_hash" ]] || {
              echo "Existing delivery ref does not match the resolved source" >&2
              exit 1
            }
          }
          verify_pr_scope() {
            local number="$1"
            local files
            files="$(
              gh api \
                --paginate \
                --slurp \
                "repos/$GITHUB_REPOSITORY/pulls/$number/files?per_page=100"
            )"
            # A newer vendored release can show up as a rename inside the
            # vendored directory, so only renames there are allowed.
            renamed="$(
              jq 'flatten | [.[] | select(
                (.status == "renamed" or .previous_filename != null) and
                ([.filename, .previous_filename] | any(
                  type != "string" or
                  (startswith("public/agent-inbox/vendor/") | not)
                ))
              )] | length' <<<"$files"
            )"
            [[ "$renamed" == "0" ]] || {
              echo "Delivery PR must not rename repository paths" >&2
              exit 1
            }
            mapfile -t changed < <(
              jq -r 'flatten | .[] | .filename, (.previous_filename // empty)' \
                <<<"$files" | sort -u
            )
            ((${#changed[@]} > 0)) || {
              echo "Delivery PR has no changed files" >&2
              exit 1
            }
            local has_metadata="false"
            for path in "${changed[@]}"; do
              [[ "$path" == "public/agent-inbox/index.html" ||
                 "$path" == "vendor/agent-inbox-landing.json" ||
                 ( "$path" =~ $asset_path_pattern &&
                   ! "$path" =~ $test_name_pattern ) ]] || {
                echo "Unexpected delivery PR path: $path" >&2
                exit 1
              }
              if [[ "$path" == "vendor/agent-inbox-landing.json" ]]; then
                has_metadata="true"
              fi
            done
            [[ "$has_metadata" == "true" ]] || {
              echo "Delivery PR is missing provenance metadata" >&2
              exit 1
            }
          }
          open_sync="$(
            gh api \
              --paginate \
              --slurp \
              "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100"
          )"
          open_sync_count="$(
            jq \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg owner "$GITHUB_REPOSITORY_OWNER" \
              'flatten | [.[] | select(
                .user.login == $owner and
                .head.repo.full_name == $repo and
                (.head.ref | test("^automation/agent-inbox-landing-[a-f0-9]{40}$"))
              )] | length' <<<"$open_sync"
          )"
          ((open_sync_count <= 1)) || {
            echo "Multiple Agent Inbox landing sync PRs are open" >&2
            exit 1
          }
          if [[ "$open_sync_count" == "1" ]]; then
            open_branch="$(
              jq -r \
                --arg repo "$GITHUB_REPOSITORY" \
                --arg owner "$GITHUB_REPOSITORY_OWNER" \
                'flatten | .[] | select(
                  .user.login == $owner and
                  .head.repo.full_name == $repo and
                  (.head.ref | test("^automation/agent-inbox-landing-[a-f0-9]{40}$"))
                ) | .head.ref' <<<"$open_sync"
            )"
            if [[ "$open_branch" != "$branch" ]]; then
              number="$(
                jq -r \
                  --arg repo "$GITHUB_REPOSITORY" \
                  --arg owner "$GITHUB_REPOSITORY_OWNER" \
                  'flatten | .[] | select(
                    .user.login == $owner and
                    .head.repo.full_name == $repo and
                    (.head.ref | test("^automation/agent-inbox-landing-[a-f0-9]{40}$"))
                  ) | .number' <<<"$open_sync"
              )"
              open_head_sha="$(
                jq -r \
                  --arg repo "$GITHUB_REPOSITORY" \
                  --arg owner "$GITHUB_REPOSITORY_OWNER" \
                  'flatten | .[] | select(
                    .user.login == $owner and
                    .head.repo.full_name == $repo and
                    (.head.ref | test("^automation/agent-inbox-landing-[a-f0-9]{40}$"))
                  ) | .head.sha' <<<"$open_sync"
              )"
              open_commit="${open_branch#automation/agent-inbox-landing-}"
              open_source="$(
                npm run --silent sync:agent-inbox-landing -- \
                  --inspect "$open_commit" \
                  --json
              )"
              open_hash="$(jq -r '.sha256' <<<"$open_source")"
              open_assets="$(jq -c '.assets' <<<"$open_source")"
              [[ "$open_hash" =~ ^[a-f0-9]{64}$ ]] || {
                echo "Invalid deferred source SHA-256" >&2
                exit 1
              }
              jq -e '
                type == "array" and length <= 16 and
                all(.[];
                  type == "object" and keys == ["path", "sha256"] and
                  (.path | type == "string" and
                    test("^vendor(/[A-Za-z0-9][A-Za-z0-9._-]*){0,3}/(LICENSE|[A-Za-z0-9][A-Za-z0-9._-]*\\.(js|mjs|css))$") and
                    (test("\\.(test|spec|bench(mark)?)(-d)?\\."; "i") | not)) and
                  (.sha256 | type == "string" and test("^[a-f0-9]{64}$"))) and
                ([.[].path] | unique | length) == length
              ' <<<"$open_assets" >/dev/null || {
                echo "Invalid deferred source assets" >&2
                exit 1
              }
              verify_delivery_ref "$open_head_sha" "$open_commit" "$open_hash" "$open_assets"
              verify_pr_scope "$number"
              {
                echo "action=defer"
                echo "branch=$branch"
                echo "pr-number=$number"
              } >>"$GITHUB_OUTPUT"
              echo "Deferring this revision while sync PR #$number is open."
              exit 0
            fi
          fi
          pr="$(gh api \
            --method GET \
            "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=all \
            -f base=main \
            -f "head=$GITHUB_REPOSITORY_OWNER:$branch" \
            -f per_page=2)"
          count="$(jq 'length' <<<"$pr")"
          ((count <= 1)) || {
            echo "Multiple delivery PRs found for the same repository branch" >&2
            exit 1
          }
          if [[ "$count" == "1" ]]; then
            head_repo="$(jq -r '.[0].head.repo.full_name' <<<"$pr")"
            head_ref="$(jq -r '.[0].head.ref' <<<"$pr")"
            author="$(jq -r '.[0].user.login' <<<"$pr")"
            base_repo="$(jq -r '.[0].base.repo.full_name' <<<"$pr")"
            base_ref="$(jq -r '.[0].base.ref' <<<"$pr")"
            [[ "$author" == "$GITHUB_REPOSITORY_OWNER" &&
               "$head_repo" == "$GITHUB_REPOSITORY" &&
               "$head_ref" == "$branch" &&
               "$base_repo" == "$GITHUB_REPOSITORY" &&
               "$base_ref" == "main" ]] || {
              echo "Delivery PR does not match the expected repository branches" >&2
              exit 1
            }
            state="$(jq -r '.[0].state' <<<"$pr")"
            number="$(jq -r '.[0].number' <<<"$pr")"
            head_sha="$(jq -r '.[0].head.sha' <<<"$pr")"
            verify_delivery_ref "$head_sha" "$SOURCE_COMMIT" "$SOURCE_SHA256" "$SOURCE_ASSETS"
            verify_pr_scope "$number"
            verified_head="$head_sha"
            case "$state" in
              open)
                action="open"
                ;;
              closed)
                action="closed"
                echo "A closed PR already records this upstream revision; not replacing it."
                ;;
              *)
                echo "Unexpected delivery PR state: $state" >&2
                exit 1
                ;;
            esac
          else
            refs="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$branch"
            )"
            ref_count="$(
              jq --arg ref "refs/heads/$branch" \
                '[.[] | select(.ref == $ref)] | length' <<<"$refs"
            )"
            if [[ "$ref_count" == "1" ]]; then
              action="recover"
            elif [[ "$ref_count" == "0" ]]; then
              action="create"
            else
              echo "Multiple exact delivery branch refs found" >&2
              exit 1
            fi
            number=""
          fi
          {
            echo "action=$action"
            echo "branch=$branch"
            echo "pr-number=$number"
            echo "verified-head=$verified_head"
          } >>"$GITHUB_OUTPUT"

      - name: Verify recoverable branch
        id: recovery
        if: steps.delivery.outputs.action == 'recover'
        env:
          BRANCH: ${{ steps.delivery.outputs.branch }}
          SOURCE_ASSETS: ${{ steps.sync.outputs.assets }}
          SOURCE_COMMIT: ${{ steps.sync.outputs.commit }}
          SOURCE_SHA256: ${{ steps.sync.outputs.sha256 }}
        run: |
          set -euo pipefail
          asset_path_pattern='^public/agent-inbox/vendor(/[A-Za-z0-9][A-Za-z0-9._-]*){0,3}/(LICENSE|[A-Za-z0-9][A-Za-z0-9._-]*\.(js|mjs|css))$'
          test_name_pattern='\.([Tt][Ee][Ss][Tt]|[Ss][Pp][Ee][Cc]|[Bb][Ee][Nn][Cc][Hh]([Mm][Aa][Rr][Kk])?)(-[Dd])?\.'
          git fetch --no-tags origin \
            "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          mapfile -t changed < <(
            git diff --no-renames --name-only "origin/main...origin/$BRANCH" |
              sort
          )
          ((${#changed[@]} > 0)) || {
            echo "Recovery branch does not differ from main" >&2
            exit 1
          }
          for path in "${changed[@]}"; do
            [[ "$path" == "public/agent-inbox/index.html" ||
               "$path" == "vendor/agent-inbox-landing.json" ||
               ( "$path" =~ $asset_path_pattern &&
                 ! "$path" =~ $test_name_pattern ) ]] || {
              echo "Unexpected recovery branch path: $path" >&2
              exit 1
            }
          done
          landing_hash="$(
            git show "origin/$BRANCH:public/agent-inbox/index.html" |
              sha256sum |
              awk '{print $1}'
          )"
          actual_metadata="$RUNNER_TEMP/recovery-metadata.json"
          expected_metadata="$RUNNER_TEMP/recovery-expected.json"
          git show \
            "origin/$BRANCH:vendor/agent-inbox-landing.json" \
            >"$actual_metadata"
          jq -n \
            --arg repository "https://github.com/shariqh/agent-inbox" \
            --arg sourcePath "marketing/index.html" \
            --arg sourceRef "main" \
            --arg commit "$SOURCE_COMMIT" \
            --arg sha256 "$SOURCE_SHA256" \
            --arg license "MIT" \
            --argjson assets "$SOURCE_ASSETS" \
            '{
              repository: $repository,
              sourcePath: $sourcePath,
              sourceRef: $sourceRef,
              commit: $commit,
              sha256: $sha256,
              license: $license
            } + if ($assets | length) > 0 then {assets: $assets} else {} end' \
            >"$expected_metadata"
          cmp --silent "$actual_metadata" "$expected_metadata" || {
            echo "Recovery branch has noncanonical metadata" >&2
            exit 1
          }
          metadata_commit="$(jq -r '.commit' "$actual_metadata")"
          metadata_hash="$(jq -r '.sha256' "$actual_metadata")"
          # The landing directory holds index.html and exactly the vendored files.
          mapfile -t landing_files < <(
            jq -r '"index.html", .[].path | "public/agent-inbox/" + .' \
              <<<"$SOURCE_ASSETS" | LC_ALL=C sort
          )
          [[ "$(
            git ls-tree -r --name-only "origin/$BRANCH" -- public/agent-inbox |
              LC_ALL=C sort
          )" == "$(printf '%s\n' "${landing_files[@]}")" ]] || {
            echo "Recovery branch has unexpected landing files" >&2
            exit 1
          }
          for path in \
            "${landing_files[@]}" \
            "vendor/agent-inbox-landing.json"; do
            read -r mode type _ < <(
              git ls-tree "origin/$BRANCH" -- "$path"
            )
            [[ "$mode" == "100644" && "$type" == "blob" ]] || {
              echo "Recovery branch contains an invalid file mode for $path" >&2
              exit 1
            }
          done
          mapfile -t asset_entries < <(
            jq -r '.[] | .path + " " + .sha256' <<<"$SOURCE_ASSETS"
          )
          for asset in "${asset_entries[@]}"; do
            [[ "$(
              git show "origin/$BRANCH:public/agent-inbox/${asset% *}" |
                sha256sum |
                awk '{print $1}'
            )" == "${asset#* }" ]] || {
              echo "Recovery branch does not match the resolved source for ${asset% *}" >&2
              exit 1
            }
          done
          [[ "$landing_hash" == "$SOURCE_SHA256" &&
             "$metadata_commit" == "$SOURCE_COMMIT" &&
             "$metadata_hash" == "$SOURCE_SHA256" ]] || {
            echo "Recovery branch does not match the resolved source" >&2
            exit 1
          }
          echo "verified-head=$(git rev-parse "origin/$BRANCH")" >>"$GITHUB_OUTPUT"

      - name: Verify exact changed-file scope
        if: steps.delivery.outputs.action == 'create'
        run: |
          set -euo pipefail
          asset_path_pattern='^public/agent-inbox/vendor(/[A-Za-z0-9][A-Za-z0-9._-]*){0,3}/(LICENSE|[A-Za-z0-9][A-Za-z0-9._-]*\.(js|mjs|css))$'
          test_name_pattern='\.([Tt][Ee][Ss][Tt]|[Ss][Pp][Ee][Cc]|[Bb][Ee][Nn][Cc][Hh]([Mm][Aa][Rr][Kk])?)(-[Dd])?\.'
          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all |
              sed 's/^...//' |
              sort
          )
          ((${#changed[@]} > 0)) || {
            echo "Sync reported a change but the worktree is clean" >&2
            exit 1
          }
          for path in "${changed[@]}"; do
            [[ "$path" == "public/agent-inbox/index.html" ||
               "$path" == "vendor/agent-inbox-landing.json" ||
               ( "$path" =~ $asset_path_pattern &&
                 ! "$path" =~ $test_name_pattern ) ]] || {
              echo "Unexpected changed path: $path" >&2
              exit 1
            }
          done
          printf '%s\n' "${changed[@]}"

      # Handed to the publish job before any dependency code runs in this job.
      - name: Upload synced landing
        if: steps.delivery.outputs.action == 'create'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-inbox-landing
          path: |
            public/agent-inbox/
            vendor/agent-inbox-landing.json
          if-no-files-found: error
          retention-days: 1

      - name: Install dependencies
        if: >-
          steps.delivery.outputs.action == 'create' ||
          steps.delivery.outputs.action == 'recover'
        run: npm ci

      - name: Validate synchronized landing
        if: >-
          steps.delivery.outputs.action == 'create' ||
          steps.delivery.outputs.action == 'recover'
        run: |
          npm test -- scripts/vendor-agent-inbox-landing.test.ts src/lib/agent-inbox-landing.test.ts
          npm run astro check
          npm run build

  # Pushes the landing and opens or tends its pull request. This is the only job
  # that sees AGENT_GH_TOKEN. It runs no npm, Node, test or build tooling and no
  # Git hooks: only Git, gh, jq and coreutils over files the sync job verified,
  # whose bytes it checks again before committing.
  publish:
    needs: sync
    if: >-
      needs.sync.outputs.action == 'create' ||
      needs.sync.outputs.action == 'recover' ||
      needs.sync.outputs.action == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check the publishing token
        env:
          GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
        run: |
          set -euo pipefail
          actor="$(gh api user --jq '.login')"
          [[ "$actor" == "$GITHUB_REPOSITORY_OWNER" ]] || {
            echo "AGENT_GH_TOKEN must authenticate as $GITHUB_REPOSITORY_OWNER" >&2
            exit 1
          }

      - name: Check out blog site
        if: needs.sync.outputs.action == 'create'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.sync.outputs.base }}

      - name: Download synced landing
        if: needs.sync.outputs.action == 'create'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-inbox-landing
          path: ${{ runner.temp }}/agent-inbox-landing

      - name: Create or recover delivery pull request
        id: publish
        if: >-
          needs.sync.outputs.action == 'create' ||
          needs.sync.outputs.action == 'recover'
        env:
          ACTION: ${{ needs.sync.outputs.action }}
          BASE: ${{ needs.sync.outputs.base }}
          BRANCH: ${{ needs.sync.outputs.branch }}
          # Every git command in this step ignores hooks, as if given
          # -c core.hooksPath=/dev/null, so nothing can run repository code.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
          GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
          LANDING: ${{ runner.temp }}/agent-inbox-landing
          RECOVERED_HEAD: ${{ needs.sync.outputs.verified-head }}
          SOURCE_ASSETS: ${{ needs.sync.outputs.assets }}
          SOURCE_COMMIT: ${{ needs.sync.outputs.commit }}
          SOURCE_NPM: ${{ needs.sync.outputs.npm }}
          SOURCE_SHA256: ${{ needs.sync.outputs.sha256 }}
        run: |
          set -euo pipefail
          # Values from the sync job are checked again before anything uses them.
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ &&
             "$SOURCE_SHA256" =~ ^[a-f0-9]{64}$ &&
             "$BRANCH" == "automation/agent-inbox-landing-$SOURCE_COMMIT" ]] || {
            echo "Invalid sync job outputs" >&2
            exit 1
          }
          jq -e '
            type == "array" and length <= 16 and
            all(.[];
              type == "object" and keys == ["path", "sha256"] and
              (.path | type == "string" and
                test("^vendor(/[A-Za-z0-9][A-Za-z0-9._-]*){0,3}/(LICENSE|[A-Za-z0-9][A-Za-z0-9._-]*\\.(js|mjs|css))$") and
                (test("\\.(test|spec|bench(mark)?)(-d)?\\."; "i") | not)) and
              (.sha256 | type == "string" and test("^[a-f0-9]{64}$"))) and
            ([.[].path] | unique | length) == length
          ' <<<"$SOURCE_ASSETS" >/dev/null || {
            echo "Invalid source assets" >&2
            exit 1
          }
          jq -e '
            type == "array" and
            all(.[];
              type == "object" and keys == ["integrity", "package"] and
              (.package | type == "string" and
                test("^three@[0-9]+\\.[0-9]+\\.[0-9]+$")) and
              (.integrity | type == "string" and
                test("^sha512-[A-Za-z0-9+/]{86}==$")))
          ' <<<"$SOURCE_NPM" >/dev/null || {
            echo "Invalid npm sources" >&2
            exit 1
          }
          asset_path_pattern='^public/agent-inbox/vendor(/[A-Za-z0-9][A-Za-z0-9._-]*){0,3}/(LICENSE|[A-Za-z0-9][A-Za-z0-9._-]*\.(js|mjs|css))$'
          test_name_pattern='\.([Tt][Ee][Ss][Tt]|[Ss][Pp][Ee][Cc]|[Bb][Ee][Nn][Cc][Hh]([Mm][Aa][Rr][Kk])?)(-[Dd])?\.'
          short="${SOURCE_COMMIT:0:12}"
          if [[ "$ACTION" == "create" ]]; then
            [[ "$(git rev-parse HEAD)" == "$BASE" ]] || {
              echo "Publish checkout must match the synced base commit" >&2
              exit 1
            }
            # The artifact holds exactly the page, its vendored files and the
            # metadata, all plain files. Their bytes are checked once staged.
            mapfile -t landing_files < <(
              jq -r '"index.html", .[].path | "public/agent-inbox/" + .' \
                <<<"$SOURCE_ASSETS" | LC_ALL=C sort
            )
            expected="$(
              printf '%s\n' "${landing_files[@]}" vendor/agent-inbox-landing.json |
                LC_ALL=C sort
            )"
            [[ -z "$(find "$LANDING" -mindepth 1 ! -type f ! -type d -print -quit)" &&
               "$(cd "$LANDING" && find . -type f | sed 's|^\./||' | LC_ALL=C sort)" == \
               "$expected" ]] || {
              echo "The synced landing artifact holds unexpected files" >&2
              exit 1
            }
            rm -rf public/agent-inbox/vendor
            while IFS= read -r path; do
              install -D -m 0644 -- "$LANDING/$path" "$path"
            done <<<"$expected"
            mapfile -t changed < <(
              git status --porcelain=v1 --untracked-files=all |
                sed 's/^...//' |
                sort
            )
            ((${#changed[@]} > 0)) || {
              echo "The synced landing changes nothing" >&2
              exit 1
            }
            for path in "${changed[@]}"; do
              [[ "$path" == "public/agent-inbox/index.html" ||
                 "$path" == "vendor/agent-inbox-landing.json" ||
                 ( "$path" =~ $asset_path_pattern &&
                   ! "$path" =~ $test_name_pattern ) ]] || {
                echo "Unexpected changed path: $path" >&2
                exit 1
              }
            done
            git -c core.hooksPath=/dev/null switch -c "$BRANCH"
            # --all also stages vendored files the new revision removed.
            git add --all -- public/agent-inbox vendor/agent-inbox-landing.json
            staged_hash="$(
              git show :public/agent-inbox/index.html |
                sha256sum |
                awk '{print $1}'
            )"
            [[ "$staged_hash" == "$SOURCE_SHA256" ]] || {
              echo "Git staging changed the vendored landing bytes" >&2
              exit 1
            }
            staged_metadata="$RUNNER_TEMP/staged-metadata.json"
            expected_metadata="$RUNNER_TEMP/staged-expected.json"
            git show :vendor/agent-inbox-landing.json >"$staged_metadata"
            jq -n \
              --arg repository "https://github.com/shariqh/agent-inbox" \
              --arg sourcePath "marketing/index.html" \
              --arg sourceRef "main" \
              --arg commit "$SOURCE_COMMIT" \
              --arg sha256 "$SOURCE_SHA256" \
              --arg license "MIT" \
              --argjson assets "$SOURCE_ASSETS" \
              '{
                repository: $repository,
                sourcePath: $sourcePath,
                sourceRef: $sourceRef,
                commit: $commit,
                sha256: $sha256,
                license: $license
              } + if ($assets | length) > 0 then {assets: $assets} else {} end' \
              >"$expected_metadata"
            cmp --silent "$staged_metadata" "$expected_metadata" || {
              echo "Git staging produced noncanonical metadata" >&2
              exit 1
            }
            # The landing directory holds index.html and exactly the vendored files.
            mapfile -t landing_files < <(
              jq -r '"index.html", .[].path | "public/agent-inbox/" + .' \
                <<<"$SOURCE_ASSETS" | LC_ALL=C sort
            )
            [[ "$(git ls-files -- public/agent-inbox | LC_ALL=C sort)" == \
               "$(printf '%s\n' "${landing_files[@]}")" ]] || {
              echo "Git staging produced unexpected landing files" >&2
              exit 1
            }
            for path in \
              "${landing_files[@]}" \
              "vendor/agent-inbox-landing.json"; do
              read -r mode _ < <(git ls-files --stage -- "$path")
              [[ "$mode" == "100644" &&
                 "$(git cat-file -t ":$path")" == "blob" ]] || {
                echo "Git staging produced an invalid file mode for $path" >&2
                exit 1
              }
            done
            mapfile -t asset_entries < <(
              jq -r '.[] | .path + " " + .sha256' <<<"$SOURCE_ASSETS"
            )
            for asset in "${asset_entries[@]}"; do
              [[ "$(
                git show ":public/agent-inbox/${asset% *}" |
                  sha256sum |
                  awk '{print $1}'
              )" == "${asset#* }" ]] || {
                echo "Git staging changed the vendored bytes of ${asset% *}" >&2
                exit 1
              }
            done
            git config user.name "shariq-dev-agent"
            git config user.email "agent@shariq.dev"
            git -c core.hooksPath=/dev/null commit \
              -m "chore: sync Agent Inbox landing ($short)" \
              -m "Source commit: $SOURCE_COMMIT
          SHA-256: $SOURCE_SHA256"
            gh auth setup-git
            git -c core.hooksPath=/dev/null push --set-upstream origin "$BRANCH"
            verified_head="$(git rev-parse HEAD)"
          else
            # The sync job fetched and verified this branch head, and the branch
            # must not have moved while that job validated it.
            [[ "$RECOVERED_HEAD" =~ ^[a-f0-9]{40}$ ]] || {
              echo "Missing verified recovery head" >&2
              exit 1
            }
            [[ "$(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" \
                --jq '.object.sha'
            )" == "$RECOVERED_HEAD" ]] || {
              echo "Recovery branch moved after verification" >&2
              exit 1
            }
            verified_head="$RECOVERED_HEAD"
          fi
          vendored=""
          if [[ "$(jq 'length' <<<"$SOURCE_ASSETS")" != "0" ]]; then
            vendored="$(
              echo
              echo "## Vendored files"
              echo
              echo "Each file matches its SHA-256 in \`marketing/vendor/manifest.json\`."
              echo
              jq -r '.[] | "- `\(.path)`: `\(.sha256)`"' <<<"$SOURCE_ASSETS"
            )"$'\n'
          fi
          npm_release=""
          if [[ "$(jq 'length' <<<"$SOURCE_NPM")" != "0" ]]; then
            npm_release="$(
              echo
              echo "## npm release"
              echo
              echo "Each vendored file is byte-identical to the same file in this npm release, whose tarball matched the registry's \`dist.integrity\`:"
              echo
              jq -r '.[] | "- `\(.package)`: `\(.integrity)`"' <<<"$SOURCE_NPM"
            )"$'\n'
          fi
          body="$RUNNER_TEMP/agent-inbox-landing-pr.md"
          cat >"$body" <<EOF
          ## Summary

          - sync the hosted Agent Inbox landing page from \`marketing/index.html\`
          - update the pinned source commit and SHA-256 metadata

          ## Source

          - Commit: \`$SOURCE_COMMIT\`
          - SHA-256: \`$SOURCE_SHA256\`
          $vendored$npm_release
          This PR was generated by the scheduled landing-page sync. Normal CI,
          preview deployment, and AI review gates apply; it is not merged
          automatically.
          EOF
          url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "Sync Agent Inbox landing ($short)" \
            --body-file "$body")"
          number="$(gh pr view "$url" --json number --jq '.number')"
          {
            echo "pr-number=$number"
            echo "verified-head=$verified_head"
          } >>"$GITHUB_OUTPUT"

      - name: Ensure built-in Copilot review
        env:
          BRANCH: ${{ needs.sync.outputs.branch }}
          EXISTING_HEAD: ${{ needs.sync.outputs.verified-head }}
          EXISTING_PR: ${{ needs.sync.outputs.pr-number }}
          GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
          PUBLISHED_HEAD: ${{ steps.publish.outputs.verified-head }}
          PUBLISHED_PR: ${{ steps.publish.outputs.pr-number }}
        run: |
          set -euo pipefail
          PR_NUMBER="${PUBLISHED_PR:-$EXISTING_PR}"
          EXPECTED_HEAD="${PUBLISHED_HEAD:-$EXISTING_HEAD}"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "Missing delivery PR number" >&2
            exit 1
          }
          [[ "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]] || {
            echo "Missing verified delivery head" >&2
            exit 1
          }
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          head="$(jq -r '.head.sha' <<<"$pr")"
          [[ "$(jq -r '.user.login' <<<"$pr")" == "$GITHUB_REPOSITORY_OWNER" &&
             "$(jq -r '.state' <<<"$pr")" == "open" &&
             "$(jq -r '.head.repo.full_name' <<<"$pr")" == "$GITHUB_REPOSITORY" &&
             "$(jq -r '.head.ref' <<<"$pr")" == "$BRANCH" &&
             "$(jq -r '.base.repo.full_name' <<<"$pr")" == "$GITHUB_REPOSITORY" &&
             "$(jq -r '.base.ref' <<<"$pr")" == "main" &&
             "$head" == "$EXPECTED_HEAD" ]] || {
            echo "Delivery PR changed after verification" >&2
            exit 1
          }
          reviewed="$(
            gh api \
              --paginate \
              --slurp \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" |
              jq --arg head "$head" \
                'flatten | [.[] | select(
                  .user.login == "copilot-pull-request-reviewer[bot]" and
                  .commit_id == $head
                )] | length'
          )"
          if [[ "$reviewed" == "0" ]]; then
            gh pr edit "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --add-reviewer copilot-pull-request-reviewer
          else
            echo "Built-in Copilot already reviewed the current PR head."
          fi
          # This job checks out nothing for an open PR, so gh is told the repository.
          [[ "$(
            gh pr view "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json headRefOid \
              --jq '.headRefOid'
          )" == "$EXPECTED_HEAD" ]] || {
            echo "Delivery PR changed while review was requested" >&2
            exit 1
          }
