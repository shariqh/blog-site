name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: deploy-shariq-dev
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Enable incoming request cancellation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          project_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/shariq-dev"
          project="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${project_url}")"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            flags="$(jq -c \
              '[.result.deployment_configs.production.compatibility_flags[]?, "enable_request_signal"] | unique' \
              <<<"${project}")"
            payload="$(jq -nc \
              --argjson flags "${flags}" \
              '{deployment_configs:{production:{compatibility_flags:$flags}}}')"
          else
            flags="$(jq -c \
              '[.result.deployment_configs.preview.compatibility_flags[]?, "enable_request_signal"] | unique' \
              <<<"${project}")"
            payload="$(jq -nc \
              --argjson flags "${flags}" \
              '{deployment_configs:{preview:{compatibility_flags:$flags}}}')"
          fi
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${payload}" \
            "${project_url}" |
            jq -e '.success == true' >/dev/null

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        id: deploy
        env:
          # Modern npm (10+) prompts on `npx wrangler@<version>` if wrangler
          # isn't installed locally, and the prompt fails non-interactively
          # in CI. Auto-accept the install.
          NPM_CONFIG_YES: "true"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Branch mapping:
          #   main      → production (shariq.dev)
          #   any other → preview deployment with its own URL
          command: pages deploy dist --project-name=shariq-dev --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deploy.outputs.deployment-url }}";
            if (!url) return;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployed: ${url}`
            });
